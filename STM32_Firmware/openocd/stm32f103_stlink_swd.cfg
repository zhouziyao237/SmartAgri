# STM32F103C8T6 + ST-LINK + SWD
# Recommended wiring: SWDIO->PA13, SWCLK->PA14, NRST->NRST, GND->GND, VTref->3.3V

source [find interface/stlink.cfg]
transport select swd

# Start conservatively. After stable attachment, 2000-4000 kHz is usually fine.
adapter speed 1000

source [find target/stm32f1x.cfg]

# Recommended when NRST is connected: reliable connect-under-reset capability.
reset_config srst_only srst_nogate connect_assert_srst
